plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'kr.or.yw'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {

	maven {
		url "https://repo.osgeo.org/repository/release/"
	}
	maven {
		url "https://repo.osgeo.org/repository/snapshot/"
	}
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// lombok
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// database
	implementation 'org.postgresql:postgresql'

	// geotools
	implementation 'org.geotools:gt-shapefile:33-SNAPSHOT'
	implementation 'org.geotools:gt-swing:33-SNAPSHOT'
	implementation 'org.geotools.jdbc:gt-jdbc-postgis:33-SNAPSHOT'
	implementation 'org.geotools:gt-geojson:33-SNAPSHOT'
	implementation 'org.geotools:gt-epsg-hsql:33-SNAPSHOT'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
